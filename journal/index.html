<!DOCTYPE html>
<html lang="en" data-base="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal &mdash; Primebase Tools</title>
  <meta name="description" content="A quiet page, kept private on this device.">
  <link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <a class="back" href="../index.html">&larr; Tools</a>

      <header class="page">
        <img class="thumb" src="../assets/img/journal.jpg" alt="" width="768" height="576">
        <div>
          <p class="eyebrow">Reflection</p>
          <h1>Journal</h1>
          <p class="lede">A quiet page, kept private on this device.</p>
        </div>
      </header>

      <section>
        <label class="field" for="jr-text" style="margin:0">
          <span>Today</span>
        </label>
        <textarea id="jr-text" placeholder="Start anywhere."></textarea>
        <div class="meta">
          <span id="jr-counts">0 words</span>
          <span><span id="jr-status"></span> <button class="linkish" id="jr-clear" type="button">Clear</button></span>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/app.js"></script>
  <script src="../assets/journal.js"></script>
</body>
</html>
