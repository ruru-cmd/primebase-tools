<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal &mdash; Primebase Tools</title>
  <meta name="description" content="A quiet space for daily thoughts, reflections and clarity. Private, stays on your device.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container narrow">
    <a class="back-link" href="index.html">&larr; All tools</a>

    <header class="page-head">
      <p class="eyebrow">Reflection</p>
      <h1>Journal</h1>
      <p class="lede">A quiet space for daily thoughts, reflections and clarity. Drafts stay only in this browser until you clear the page.</p>
    </header>

    <div class="panel journal-panel">
      <textarea id="jr-text" placeholder="Start anywhere. A thought, a fear, a small win, a prayer. There is nothing to format here."></textarea>
      <div class="journal-meta">
        <span class="status"><span class="dot idle" id="jr-dot"></span><span id="jr-status">Nothing written yet</span></span>
        <span class="counts" id="jr-counts">0 words &middot; 0 characters</span>
        <button class="btn-ghost" id="jr-clear" type="button">Clear page</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/app.js"></script>
  <script src="assets/journal.js"></script>
</body>
</html>
