<!DOCTYPE html>
<html lang="en" data-base="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom Tracker &mdash; Primebase Tools</title>
  <meta name="description" content="Measure wealth in time. See how long your savings could carry you.">
  <link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <a class="back" href="../index.html">&larr; Tools</a>

      <header class="page">
        <img class="thumb" src="../assets/img/freedom.jpg" alt="" width="768" height="576">
        <div>
          <p class="eyebrow">Finance</p>
          <h1>Freedom Tracker</h1>
          <p class="lede">How long could your savings carry you?</p>
        </div>
      </header>

      <div class="split">
        <section>
          <div class="field">
            <span>Monthly expenses</span>
            <input id="ft-expenses" type="number" min="0" step="100" placeholder="10000" inputmode="numeric">
          </div>
          <div class="field">
            <span>Savings</span>
            <input id="ft-savings" type="number" min="0" step="100" placeholder="50000" inputmode="numeric">
          </div>
          <button class="btn" id="ft-run" type="button">See my freedom</button>
        </section>

        <section id="ft-result" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/app.js"></script>
  <script src="../assets/ft.js"></script>
</body>
</html>
