<!DOCTYPE html>
<html lang="en" data-base="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glide Check &mdash; Primebase Tools</title>
  <meta name="description" content="Is it a task, or a disguise? Run a task through a gentle focus check.">
  <link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <a class="back" href="../index.html">&larr; Tools</a>

      <header class="page">
        <img class="thumb" src="../assets/img/glide.jpg" alt="" width="768" height="576">
        <div>
          <p class="eyebrow">Focus</p>
          <h1>Glide Check</h1>
          <p class="lede">Is it a task, or a disguise?</p>
        </div>
      </header>

      <section>
        <div class="field">
          <span>What task is on your mind?</span>
          <textarea class="short" id="gt-task" placeholder="A task that has been nagging you&hellip;"></textarea>
        </div>
        <div class="field">
          <span>Does it move you closer to a goal you care about?</span>
          <select id="gt-goal">
            <option value="">Choose&hellip;</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="unsure">Not sure</option>
          </select>
        </div>
        <div class="field">
          <span>How urgent does it feel?</span>
          <select id="gt-urgent">
            <option value="">Choose&hellip;</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <button class="btn" id="gt-run" type="button">Run the check</button>

        <section class="verdict" id="gt-result" aria-live="polite" hidden></section>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/app.js"></script>
  <script src="../assets/glide.js"></script>
</body>
</html>
